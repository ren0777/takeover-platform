name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: takeover_test
          POSTGRES_PASSWORD: takeover_test_local
          POSTGRES_DB: takeover_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U takeover_test -d takeover_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://takeover_test:takeover_test_local@localhost:5432/takeover_ci_test
      TEST_DATABASE_URL: postgresql://takeover_test:takeover_test_local@localhost:5432/takeover_ci_test
      TAKEOVER_ALLOW_TEST_DATABASE_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @takeover/database db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      # Live-resource and origin variables are scoped to build/smoke so the unit
      # suites keep exercising fixtures and origin-safety checks hermetically.
      - run: pnpm build
        env:
          TAKEOVER_API_ORIGIN: http://127.0.0.1:4000
          TAKEOVER_LIVE_RESOURCES: all
          NEXT_PUBLIC_SITE_URL: https://takeover.example
      - run: pnpm smoke:api
